name: Build & Release APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Compute version
        id: ver
        run: |
          VC=$((GITHUB_RUN_NUMBER + 1))
          echo "code=$VC" >> "$GITHUB_OUTPUT"
          echo "tag=v1.0.$VC" >> "$GITHUB_OUTPUT"
          echo "msg=$(git log -1 --pretty=%B | head -n 10)" >> "$GITHUB_OUTPUT"

      - name: Build signed Release APK
        run: ./gradlew assembleRelease -PversionCode=${{ steps.ver.outputs.code }} --no-daemon

      - name: Copy & rename APK
        run: |
          cp app/build/outputs/apk/release/app-release.apk "CinemaBooking-${{ steps.ver.outputs.tag }}.apk"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: "Cinema Booking ${{ steps.ver.outputs.tag }}"
          body: |
            Update otomatis dari push ke `main` (${{ github.sha }}).

            Perubahan terbaru:
            ${{ steps.ver.outputs.msg }}
          files: CinemaBooking-${{ steps.ver.outputs.tag }}.apk
