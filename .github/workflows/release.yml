name: Build & Release APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Compute version
        id: ver
        run: |
          VC=$((GITHUB_RUN_NUMBER + 1))
          echo "code=$VC" >> "$GITHUB_OUTPUT"
          echo "tag=v1.0.$VC" >> "$GITHUB_OUTPUT"
          {
            echo "msg<<EOF"
            git log -1 --pretty=%B | head -n 10
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build signed Release APK
        run: ./gradlew assembleRelease -PversionCode=${{ steps.ver.outputs.code }} --no-daemon --stacktrace

      - name: Copy & rename APK
        run: |
          cp app/build/outputs/apk/release/app-release.apk "CinemaBooking-${{ steps.ver.outputs.tag }}.apk"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: "Cinema Booking ${{ steps.ver.outputs.tag }}"
          body: |
            • Pengalih bahasa ID & ENG di halaman utama (bawaan awal ENG, bisa diubah kapan saja)
            • Wajib login sebelum memilih kursi film maupun memesan makanan & minuman
            • Tagihan pembayaran & struk khusus makanan/minuman kini terpisah rapi (bukan label film)
            • Peta bioskop dapat digeser bebas dengan tombol zoom simetris & menu Buat Akun Baru
          files: CinemaBooking-${{ steps.ver.outputs.tag }}.apk
